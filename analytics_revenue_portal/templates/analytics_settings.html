{% extends "base_saas.html" %}
{% block title %}Platform Settings - Nova OS{% endblock %}
{% block page_title %}Platform Settings{% endblock %}
{% block page_subtitle %}Manage your admin and website preferences.{% endblock %}
{% block content %}
<div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm max-w-3xl">
  <div class="px-6 py-5 border-b border-slate-200 bg-slate-50">
    <h3 class="font-bold text-slate-900">Admin Account</h3>
  </div>
  <div class="p-6 space-y-4">
    <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Admin Email</label>
        <input type="text" value="admin@novabrief.local" disabled class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-500">
    </div>
    <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Change Password</label>
        <input type="password" placeholder="New password" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:border-blue-500 outline-none">
    </div>
    <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition" onclick="alert('Password update disabled in demo mode.')">Save Changes</button>
  </div>
</div>
{% endblock %}
