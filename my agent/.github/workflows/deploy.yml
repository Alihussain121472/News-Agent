name: Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Test database initialization
      run: |
        python -c "from database import NewsDatabase; db = NewsDatabase('test.db'); print('✓ Database initialized successfully')"
    
    - name: Test Flask app
      run: |
        timeout 5 python -c "from web_server import app; print('✓ Flask app loaded successfully')" || true
    
    - name: Notify Render (if configured)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "✓ Ready to deploy to Render"
        echo "Render will automatically deploy this push"
