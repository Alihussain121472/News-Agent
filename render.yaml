services:
  - type: web
    name: novabrief-web
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: gunicorn web_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Nova Brief <updates@novabrief.tech>
      - key: RESEND_REPLY_TO
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: EMAIL_FROM_NAME
        value: Nova Brief
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "false"
      - key: SEO_SITE_URL
        value: https://www.novabrief.tech
      - key: GOOGLE_ADSENSE_CLIENT_ID
        sync: false
      - key: GOOGLE_ADSENSE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADSENSE_REDIRECT_URI
        value: https://www.novabrief.tech/analytics/adsense/callback
      - key: ADSENSE_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: "10000"
  - type: cron
    name: novabrief-daily-email
    env: python
    plan: starter
    autoDeploy: true
    schedule: "0 10 * * *"
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: python ai_news_agent.py --run-now
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Nova Brief <updates@novabrief.tech>
      - key: RESEND_REPLY_TO
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: EMAIL_FROM_NAME
        value: Nova Brief
  - type: cron
    name: novabrief-seo-monitor
    env: python
    plan: starter
    autoDeploy: true
    schedule: "15 * * * *"
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: python -m growth_seo_agent.runner --trigger scheduled
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SEO_SITE_URL
        value: https://www.novabrief.tech
