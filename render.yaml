services:
  - type: web
    name: novabrief-web
    env: python
    rootDir: my agent
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_server:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@novabrief.local"
      - key: ADMIN_PASSWORD
        value: "change-me-now"
      - key: GMAIL_USER
        value: ""
      - key: GMAIL_APP_PASSWORD
        value: ""
      - key: NEWSAPI_KEY
        value: ""
      - key: RECIPIENT_EMAIL
        value: ""
