<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Nova Brief</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;font-family:'Inter',sans-serif;}.glass{background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}</style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-2xl shadow-indigo-500/30 mb-4">
        <i class="fas fa-shield-alt text-white text-2xl"></i>
      </div>
      <h1 class="text-3xl font-black text-white mb-2">Admin Access</h1>
      <p class="text-slate-400 text-sm">Restricted — authorized personnel only</p>
    </div>
    <div class="glass rounded-2xl p-8">
      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Admin Email</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="email" id="email" placeholder="admin@novabrief.local" required class="w-full bg-black/30 border border-white/10 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition"/>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Admin Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="password" id="password" placeholder="••••••••••••" required class="w-full bg-black/30 border border-white/10 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition"/>
          </div>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
          <i class="fas fa-shield-alt"></i> Login as Admin
        </button>
      </form>
      <div id="message" class="hidden mt-4 rounded-xl p-3 text-sm font-semibold text-center"></div>
      <div class="mt-6 text-center text-sm text-slate-600">
        <a href="/user/login" class="hover:text-slate-400 transition">User Login →</a>
        &nbsp;·&nbsp;
        <a href="/" class="hover:text-slate-400 transition">Home →</a>
      </div>
    </div>
  </div>
  <script>
  document.getElementById('adminLoginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const msg=document.getElementById('message'); const btn=this.querySelector('button[type=submit]');
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Authenticating...';
    try{
      const r=await fetch('/api/auth/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
      const d=await r.json();
      msg.className='mt-4 rounded-xl p-3 text-sm font-semibold text-center '+(r.ok&&d.status==='success'?'bg-emerald-500/20 text-emerald-300':'bg-red-500/20 text-red-300');
      msg.textContent=d.message; msg.classList.remove('hidden');
      if(r.ok&&d.status==='success') setTimeout(()=>window.location.href=d.redirect||'/dashboard',800);
    }catch(err){ msg.className='mt-4 rounded-xl p-3 text-sm font-semibold text-center bg-red-500/20 text-red-300'; msg.textContent='Unexpected error.'; msg.classList.remove('hidden');
    }finally{ btn.disabled=false; btn.innerHTML='<i class="fas fa-shield-alt mr-2"></i>Login as Admin'; }
  });
  </script>
</body>
</html>
