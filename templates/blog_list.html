<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Brief Blog - Tech News & AI</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

    <meta name="description" content="Read the latest insights on AI, Tech, and student growth from Nova Brief.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fas fa-bolt"></i></div>
                    <span class="font-bold text-xl tracking-tight text-slate-900">Nova Brief</span>
                </a>
                <a href="/login" class="text-slate-600 hover:text-blue-600 font-medium text-sm">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-24">
        <h1 class="text-4xl font-extrabold text-slate-900 mb-2">Latest Insights</h1>
        <p class="text-lg text-slate-600 mb-12">Actionable tech news, AI tutorials, and career growth strategies.</p>
        
        <!-- Google AdSense Placeholder -->
        <div class="w-full bg-white border border-slate-200 rounded-xl mb-12 flex items-center justify-center p-4 text-center min-h-[100px]">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1036052096443002" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="space-y-8">
            {% for post in posts %}
            <article class="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm hover:shadow-md transition">
                <h2 class="text-2xl font-bold text-slate-900 mb-3"><a href="/blog/{{ post.slug }}" class="hover:text-blue-600">{{ post.title }}</a></h2>
                <p class="text-slate-500 text-sm mb-4"><i class="far fa-clock mr-1"></i> Published {{ post.published_at[:10] }}</p>
                <p class="text-slate-700 leading-relaxed mb-4">{{ post.meta_description }}</p>
                <a href="/blog/{{ post.slug }}" class="text-blue-600 font-bold hover:underline">Read full article <i class="fas fa-arrow-right ml-1"></i></a>
            </article>
            {% else %}
            <div class="text-center py-12">
                <p class="text-slate-500">More articles coming soon!</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
