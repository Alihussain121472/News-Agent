<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Nova Brief</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

    <meta name="description" content="{{ post.meta_description }}">
    <meta name="google-adsense-account" content="ca-pub-1036052096443002">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1036052096443002" crossorigin="anonymous"></script>

  </head>

<body class="bg-slate-50 font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fas fa-bolt"></i></div>
                    <span class="font-bold text-xl tracking-tight text-slate-900">Nova Brief</span>
                </a>
                <div class="flex gap-4">
                    <a href="/blog" class="text-slate-600 hover:text-blue-600 font-medium text-sm mt-1">All Articles</a>
                    <a href="/register" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg font-medium text-sm hover:bg-blue-700 transition">Get Daily Brief</a>
                </div>
            </div>
        </div>
    </nav>

    <article class="max-w-3xl mx-auto px-4 sm:px-6 py-24">
        <a href="/blog" class="text-blue-600 text-sm font-bold mb-6 inline-block hover:underline"><i class="fas fa-arrow-left mr-1"></i> Back to Blog</a>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 leading-tight">{{ post.title }}</h1>
        <p class="text-slate-500 mb-10 pb-6 border-b border-slate-200"><i class="far fa-calendar-alt mr-2"></i> Published on {{ post.published_at[:10] }} &bull; 5 min read</p>
        
        <div class="prose prose-lg max-w-none prose-slate">
            {{ post.content | safe }}
        </div>

    </article>
</body>
</html>
