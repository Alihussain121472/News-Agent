<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="description" content="Nova Brief is the ultimate AI News Agent and Growth platform for students and tech enthusiasts. Get daily updates on AI, tech programs, and exclusive certifications.">
  <meta name="keywords" content="AI News, Tech News, Student Programs, Google Certifications, Microsoft Student, AI Automation, Tech Opportunities">
  <title>Forgot Password - Nova Brief</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-slate-900">Reset Password</h2>
      <p class="text-slate-500 mt-2 text-sm">Enter your email and we'll send you a link to reset your password.</p>
    </div>
    
    {% if success %}
    <div class="bg-green-50 border border-green-200 text-green-700 p-4 rounded-lg text-sm mb-6 text-center">
      If an account exists with that email, a reset link has been sent. Please check your inbox.
    </div>
    <a href="/user/login" class="w-full block text-center bg-slate-900 text-white rounded-xl py-3 font-medium hover:bg-slate-800 transition">Return to Login</a>
    {% else %}
    <form method="POST" action="/user/forgot-password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
        <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none" placeholder="you@example.com">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-semibold transition">Send Reset Link</button>
    </form>
    <div class="mt-6 text-center text-sm">
      <a href="/user/login" class="text-slate-500 hover:text-slate-800 font-medium transition">Back to Login</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
