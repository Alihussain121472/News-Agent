<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="description" content="Nova Brief is the ultimate AI News Agent and Growth platform for students and tech enthusiasts. Get daily updates on AI, tech programs, and exclusive certifications.">
  <meta name="keywords" content="AI News, Tech News, Student Programs, Google Certifications, Microsoft Student, AI Automation, Tech Opportunities">
  <title>Set New Password - Nova Brief</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-slate-900">Set New Password</h2>
      <p class="text-slate-500 mt-2 text-sm">Please enter your new password below.</p>
    </div>
    
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg text-sm mb-6 text-center">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="/user/reset-password/{{ token }}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">New Password</label>
        <input type="password" name="password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-semibold transition">Update Password</button>
    </form>
  </div>
</body>
</html>
