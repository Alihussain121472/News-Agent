<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Nova Brief</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>body{background:linear-gradient(180deg,#020817 0%,#0f172a 100%);min-height:100vh;font-family:'Inter',sans-serif;}.glass{background:rgba(15,23,42,0.8);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,0.15);}</style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/30"><i class="fas fa-newspaper text-white"></i></div>
        <span class="text-xl font-bold text-white">Nova Brief</span>
      </a>
      <h1 class="text-3xl font-black text-white mb-2">Create Account</h1>
      <p class="text-slate-400 text-sm">Get daily AI news + student program alerts</p>
    </div>
    <div class="glass rounded-2xl p-8">
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Full Name</label>
          <div class="relative">
            <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="name" placeholder="Your name" required class="w-full bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Email</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="email" id="email" placeholder="your@email.com" required class="w-full bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required class="w-full bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
          </div>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>
      <div id="message" class="hidden mt-4 rounded-xl p-3 text-sm font-semibold text-center"></div>
      <div class="mt-6 text-center space-y-2 text-sm text-slate-500">
        <p>Already have an account? <a href="/user/login" class="text-blue-400 hover:text-blue-300 font-semibold">Sign in</a></p>
        <p><a href="/" class="text-slate-600 hover:text-slate-400 transition"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a></p>
      </div>
    </div>
  </div>
  <script>
  document.getElementById('registerForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const msg=document.getElementById('message'); const btn=this.querySelector('button[type=submit]');
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Creating account...';
    try{
      const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
      const d=await r.json();
      msg.className='mt-4 rounded-xl p-3 text-sm font-semibold text-center '+(r.ok&&d.status==='success'?'bg-emerald-500/20 text-emerald-300':'bg-red-500/20 text-red-300');
      msg.textContent=d.message; msg.classList.remove('hidden');
      if(r.ok&&d.status==='success') setTimeout(()=>window.location.href=d.redirect||'/user/dashboard',800);
    }catch(err){ msg.className='mt-4 rounded-xl p-3 text-sm font-semibold text-center bg-red-500/20 text-red-300'; msg.textContent='Unexpected error.'; msg.classList.remove('hidden');
    }finally{ btn.disabled=false; btn.innerHTML='<i class="fas fa-user-plus mr-2"></i>Create Account'; }
  });
  </script>
</body>
</html>
